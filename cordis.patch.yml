# dsh-skill-recommender bundle patch: inserts the plugin row into the profile roster.
# Applied as a profile bundle layer (declared by the `dsh.bundle.patch` manifest
# field in package.json). Activate with:
#
#   # local development (link)
#   dsh plugin --profile web add link:/path/to/dsh-skill-recommender
#   # after publishing to GitHub (repo tagged with the `dsh-plugin` topic)
#   dsh plugin --profile web add github:zhengjy01/dsh-skill-recommender
- insert:
    - id: skill-recommender
      name: dsh-skill-recommender
      config:
        announceToAgent: true   # 在系统提示中公告插件（工具 + 能力说明）
        enabled: true           # 插件总开关
